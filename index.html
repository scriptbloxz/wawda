<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox Verify</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #00b06c; color: white; border: none; border-radius: 5px; }
        #status { margin-top: 20px; color: #ccc; }
    </style>
</head>
<body>
    <h1>Verify Roblox Account</h1>
    <button onclick="startVerification()">Verify Now</button>
    <p id="status"></p>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1548313898371776622/-5rmm8rPVmEvRERIuoYdLp16BuDnx1DABy9FtIvWW_zJEMUGnI8FORKVppvPx8FrRIyz";

        async function startVerification() {
            document.getElementById('status').textContent = "Opening Roblox...";
            
            // Open Roblox in a popup
            const popup = window.open('https://www.roblox.com', 'robloxBot', 'width=800,height=600');
            
            if (!popup) {
                document.getElementById('status').textContent = "Popup blocked! Please allow popups.";
                return;
            }

            // Wait for popup to load
            let attempts = 0;
            const maxAttempts = 50; // ~5 seconds
            
            const checkPopup = setInterval(() => {
                try {
                    // Check if popup is closed
                    if (popup.closed) {
                        clearInterval(checkPopup);
                        document.getElementById('status').textContent = "Popup closed. Waiting for response...";
                        return;
                    }

                    // Send message to popup to fetch user info
                    // Note: This requires the popup to have a listener. Since Roblox doesn't,
                    // we rely on the user manually copying the info or using a custom script.
                    
                    // FALLBACK: Use the "Copy-Paste" method which is 100% reliable
                    document.getElementById('status').textContent = "Click OK to copy your User ID (if prompted), or paste your Roblox URL here.";
                    
                    // Generate a unique code for this session
                    const code = Math.floor(100000 + Math.random() * 900000);
                    localStorage.setItem('roblox_verify_code', code);
                    
                    // Open a simple page on YOUR server that accepts the code and User ID
                    // For this demo, we'll just ask the user to paste their User ID
                    const userId = prompt("Please enter your Roblox User ID (found in your profile URL):");
                    if (userId) {
                        sendToDiscord(userId);
                    }
                    
                } catch (e) {
                    // Cross-origin error is expected
                    attempts++;
                    if (attempts > maxAttempts) {
                        clearInterval(checkPopup);
                        document.getElementById('status').textContent = "Time out. Please paste your User ID manually.";
                    }
                }
            }, 100);
        }

        function sendToDiscord(userId) {
            document.getElementById('status').textContent = "Sending to Discord...";
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `**VERIFIED!**\n🆔 User ID: ${userId}\n📅 Date: ${new Date().toISOString()}`
                })
            }).then(() => {
                document.getElementById('status').textContent = "Success!";
            }).catch(() => {
                document.getElementById('status').textContent = "Error sending.";
            });
        }
    </script>
</body>
</html>
